name: Uptime

on:
  schedule:
    # Every 15 minutes. GitHub may delay scheduled runs under load.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run uptime checks
        env:
          STATUS_CHECK_SECRET: ${{ secrets.STATUS_CHECK_SECRET }}
        run: node scripts/check-uptime.mjs

      - name: Commit updated status data
        run: |
          git config user.name "xenith-status-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/monitor-data.json
          if git diff --staged --quiet; then
            echo "No status changes to commit."
          else
            git commit -m "chore(uptime): update status data"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
