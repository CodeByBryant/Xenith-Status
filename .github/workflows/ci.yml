name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/monitor-data.json"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
